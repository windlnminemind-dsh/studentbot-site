<svg xmlns="http://www.w3.org/2000/svg" width="220" height="88" viewBox="0 0 220 88" role="img" aria-label="Штамп: 30 кредитов на старте">
  <title>30 кредитов на старте</title>
  <desc>Прямоугольный штамп с двойной рамкой: «30 КРЕДИТОВ НА СТАРТЕ».</desc>
  <g transform="rotate(-2.4 110 44)">
    <g fill="none" stroke="#C0552F" stroke-linecap="round">
      <rect x="7" y="7" width="206" height="74" rx="2" stroke-width="2.8" stroke-dasharray="118 2.2 44 1.8 108 2.4 84 1.8"/>
      <rect x="12.5" y="12.5" width="195" height="63" rx="1" stroke-width="1.1" stroke-dasharray="96 2 150 2 92 2"/>
    </g>
    <g fill="#C0552F" font-family="'PT Sans Narrow', Impact, 'Arial Narrow', sans-serif" text-anchor="middle">
      <text x="110" y="38" font-size="26" font-weight="700" textLength="166" lengthAdjust="spacingAndGlyphs">30 КРЕДИТОВ</text>
      <text x="110" y="69" font-size="17.5" font-weight="700" textLength="122" lengthAdjust="spacingAndGlyphs">НА СТАРТЕ</text>
    </g>
    <circle cx="44" cy="20" r="1" fill="#C0552F" fill-opacity=".55"/>
    <circle cx="178" cy="74" r="1.2" fill="#C0552F" fill-opacity=".45"/>
  </g>
</svg>
